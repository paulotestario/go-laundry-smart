<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    width:100%;height:100%;
    background:radial-gradient(120% 100% at 50% 0%, #16324f 0%, #060d18 65%);
    display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }

  .phone{
    width:390px;height:820px;
    background:#0b0b0f;
    border-radius:56px;
    padding:14px;
    box-shadow:0 40px 100px rgba(0,0,0,.6), inset 0 0 0 2px #2a2a30;
    position:relative;
  }
  .screen{
    width:100%;height:100%;
    background:#000;
    border-radius:42px;
    overflow:hidden;
    position:relative;
  }
  .notch{
    position:absolute;
    top:0;left:50%;
    transform:translateX(-50%);
    width:120px;height:28px;
    background:#0b0b0f;
    border-radius:0 0 18px 18px;
    z-index:80;
  }
  .status-bar{
    position:absolute;
    top:0;left:0;right:0;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 26px;
    color:#fff;
    font-size:14px;
    font-weight:700;
    z-index:70;
  }

  /* ============ LOCK SCREEN ============ */
  .lock-screen{
    position:absolute; inset:0;
    background:
      radial-gradient(140% 90% at 50% -10%, #274870 0%, #0a1c33 45%, #050b16 100%);
  }
  .lock-time{
    position:absolute;
    top:130px; left:0; right:0;
    text-align:center;
    color:#fff;
  }
  .lock-time .big{
    font-size:78px;
    font-weight:600;
    letter-spacing:-.02em;
    line-height:1;
  }
  .lock-time .date{
    font-size:16px;
    font-weight:500;
    margin-top:8px;
    color:#E4ECF7;
  }
  .lock-hint{
    position:absolute;
    bottom:60px; left:0; right:0;
    text-align:center;
    color:rgba(255,255,255,.6);
    font-size:13px;
    font-weight:500;
  }

  /* ============ NOTIFICATION ============ */
  .notif{
    position:absolute;
    left:12px; right:12px;
    top:70px;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(30px);
    border-radius:20px;
    padding:14px 14px;
    display:flex;
    gap:12px;
    box-shadow:0 20px 45px rgba(0,0,0,.35);
    z-index:60;
    transform:translateY(-140px) scale(.9);
    opacity:0;
    animation: notifIn .55s cubic-bezier(.34,1.4,.5,1) forwards;
    animation-delay:.9s;
  }
  .notif.pressed{
    animation: notifIn .55s cubic-bezier(.34,1.4,.5,1) forwards,
               notifPress .2s ease forwards;
    animation-delay:.9s, 2.9s;
  }
  .notif-icon{
    width:42px; height:42px;
    border-radius:11px;
    overflow:hidden;
    flex:none;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .notif-icon img{ width:100%; height:100%; object-fit:cover; }
  .notif-body{ flex:1; min-width:0; }
  .notif-top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:2px;
  }
  .notif-app{
    font-size:12.5px;
    font-weight:700;
    color:#3a3a3c;
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .notif-time{ font-size:12px; color:#8a8a8e; }
  .notif-title{
    font-size:14.5px;
    font-weight:700;
    color:#0a0a0a;
    margin-bottom:2px;
  }
  .notif-text{
    font-size:13.5px;
    color:#3a3a3c;
    line-height:1.35;
  }

  .notif-glow{
    position:absolute;
    left:12px; right:12px; top:70px;
    height:74px;
    border-radius:20px;
    z-index:59;
    opacity:0;
    box-shadow:0 0 0 0 rgba(91,200,245,.7);
    animation: notifGlow 1s ease-out forwards;
    animation-delay:1.3s;
  }

  /* ============ TRANSITION TO APP (finished state) ============ */
  .app-open{
    position:absolute; inset:0;
    z-index:120;
    opacity:0;
    transform:scale(1.04);
    animation: appOpen .5s cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay:3.05s;
    background:#EFF7FC;
  }
  .app-open iframe{
    width:100%; height:100%;
    border:none;
    margin-top:46px;
  }

  /* ============ KEYFRAMES ============ */
  @keyframes notifIn{
    0%{ transform:translateY(-140px) scale(.9); opacity:0; }
    60%{ transform:translateY(6px) scale(1.02); opacity:1; }
    100%{ transform:translateY(0) scale(1); opacity:1; }
  }
  @keyframes notifPress{
    0%{ transform:translateY(0) scale(1); }
    100%{ transform:translateY(0) scale(.96); }
  }
  @keyframes notifGlow{
    0%{ opacity:.9; box-shadow:0 0 0 0 rgba(91,200,245,.7); }
    100%{ opacity:0; box-shadow:0 0 0 18px rgba(91,200,245,0); }
  }
  @keyframes appOpen{
    to{ opacity:1; transform:scale(1); }
  }
</style>
</head>
